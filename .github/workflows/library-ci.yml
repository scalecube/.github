name: CI

on:
  workflow_call:
    inputs:
      mvn-verify-opts:
        type: string
        required: false
        default: "['']"
        description: Extra Maven options (JSON array, joined with spaces), e.g. "['-Pcoverage']".
      mvn-threads:
        type: string
        required: false
        default: "1C"
        description: Maven -T value for parallel module builds. Use "1" to build modules sequentially.
      rc-retention-days:
        type: number
        required: false
        default: 30
        description: After a master release, delete this repo's RC package versions (x.y.z-...-rcN) older than this many days. Use 0 to disable.
    secrets:
      ORGANIZATION_TOKEN:
        required: true
      CODACY_PROJECT_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a master release or a release deploy half-way (tags/packages would be left inconsistent).
  cancel-in-progress: ${{ github.ref_name != 'master' && github.event_name != 'release' }}

env:
  MVN_OPTS: -B -V -T ${{ inputs.mvn-threads }} ${{ join(fromJson(inputs.mvn-verify-opts), ' ') }}

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.ref_name == 'master' && 0 || 1 }}
          fetch-tags: ${{ github.ref_name == 'master' }}

      # Release commits change the version in every pom.xml, so an exact-key cache would always miss on master and tags.
      # restore-keys falls back to the latest cache (saved from master, readable by every branch and tag);
      # the second key picks up caches saved by the previous version of this workflow.
      - name: Restore Maven cache
        id: maven-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
            ${{ runner.os }}-maven-

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Maven
        run: cp build.settings.xml ~/.m2/settings.xml

      - name: Maven Verify
        if: github.event_name != 'release' && github.ref_name != 'master'
        run: mvn verify $MVN_OPTS
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_TOKEN }}

      - name: Configure git
        if: github.event_name != 'release' && github.ref_name == 'master'
        run: |
          echo "Git checkout branch ${GITHUB_REF##*/}, commit ${GITHUB_SHA} was pushed by ${GITHUB_ACTOR}"
          git checkout ${GITHUB_REF##*/}
          echo "Git reset hard to ${GITHUB_SHA}"
          git reset --hard ${GITHUB_SHA}
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global user.name "${GITHUB_ACTOR}"

      # Only rewrites versions, commits and tags locally (no build, no push). preparationGoals must not need
      # dependency resolution: at validate the release-version reactor jars do not exist yet, so use clean.
      - name: Prepare release
        id: prepare_release
        if: github.event_name != 'release' && github.ref_name == 'master'
        run: |
          mvn -B build-helper:parse-version release:prepare \
            -DreleaseVersion=\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.incrementalVersion} \
            -DdevelopmentVersion=\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion}-SNAPSHOT \
            -DpreparationGoals=clean \
            -DpushChanges=false
          echo release_tag=$(grep '^scm.tag=' release.properties | cut -d= -f2) >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_TOKEN }}

      # Single build of the release tag: compile, test and deploy. deployAtEnd uploads nothing unless every module succeeds.
      # performRelease turns on Maven's release-profile, which adds the -sources and -javadoc jars.
      - name: Build and deploy release
        if: github.event_name != 'release' && github.ref_name == 'master'
        run: |
          git checkout ${{ steps.prepare_release.outputs.release_tag }}
          mvn deploy $MVN_OPTS -DdeployAtEnd=true -DperformRelease=true -Ddocker.image.extra-tag=master -Dmaven.resolver.transport=wagon
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_TOKEN }}

      - name: Push release commits and tag
        if: github.event_name != 'release' && github.ref_name == 'master'
        run: |
          git checkout ${GITHUB_REF##*/}
          git push --atomic origin ${GITHUB_REF##*/} ${{ steps.prepare_release.outputs.release_tag }}

      - name: Deploy release version
        if: github.event_name == 'release'
        run: |
          release_version=${{ github.event.release.tag_name }}
          echo Release version $release_version
          mvn -B versions:set -DnewVersion=$release_version -DgenerateBackupPoms=false
          mvn deploy $MVN_OPTS -DdeployAtEnd=true -DperformRelease=true
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_TOKEN }}

      - name: Rollback release (remove tag)
        if: failure() && github.event_name == 'release'
        run: git push origin :refs/tags/${{ github.event.release.tag_name }}

      # Codacy reuses the classes and JaCoCo reports produced above instead of rebuilding the project in a separate job.
      - name: Run Codacy Analysis CLI
        if: github.event_name != 'release' && env.HAS_CODACY_TOKEN == 'true'
        uses: codacy/codacy-analysis-cli-action@master
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        with:
          tool: spotbugs
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          upload: true
          max-allowed-issues: 2147483647
          skip-uncommitted-files-check: true
          verbose: true
        continue-on-error: true

      - name: Find all JaCoCo reports
        id: find-coverage
        if: github.event_name != 'release' && env.HAS_CODACY_TOKEN == 'true'
        run: |
          files=$(find . -path '*/target/site/jacoco/jacoco.xml' | paste -sd "," -)
          echo "files=$files" >> $GITHUB_OUTPUT

      - name: Upload coverage to Codacy
        if: github.event_name != 'release' && env.HAS_CODACY_TOKEN == 'true' && steps.find-coverage.outputs.files != ''
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.find-coverage.outputs.files }}
          language: Java
        continue-on-error: true

      - name: Prune SNAPSHOT artifacts from Maven cache
        if: success() && github.ref_name == 'master' && steps.maven-cache.outputs.cache-hit != 'true'
        run: find ~/.m2/repository -type d -name '*-SNAPSHOT' -prune -exec rm -rf {} +

      - name: Save Maven cache
        if: success() && github.ref_name == 'master' && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}

  # GitHub Packages gets slower serving maven-metadata.xml as a package piles up versions, and most of them are
  # branch RCs. Runs after the release, so it never delays or fails it. Needs delete:packages on ORGANIZATION_TOKEN.
  cleanup-rc-versions:
    name: Delete old RC versions
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'master' && inputs.rc-retention-days > 0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      GH_TOKEN: ${{ secrets.ORGANIZATION_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      RETENTION_DAYS: ${{ inputs.rc-retention-days }}
      # Keeps a run well under the 5000 requests/hour API limit; a large backlog is drained over several releases.
      MAX_DELETIONS: 1000
    steps:
      - name: Delete RC versions older than ${{ inputs.rc-retention-days }} days
        run: |
          cutoff=$(date -u -d "-${RETENTION_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting RC versions of ${OWNER}/${REPO} packages created before ${cutoff}"
          packages=$(gh api --paginate "/orgs/${OWNER}/packages?package_type=maven&per_page=100" \
            --jq ".[] | select(.repository.name == \"${REPO}\") | .name")
          deleted=0
          for pkg in $packages; do
            ids=$(gh api --paginate "/orgs/${OWNER}/packages/maven/${pkg}/versions?per_page=100" \
              --jq ".[] | select((.name | test(\"-rc[0-9]+$\"; \"i\")) and .created_at < \"${cutoff}\") | .id")
            count=0
            for id in $ids; do
              if [ $deleted -ge $MAX_DELETIONS ]; then
                echo "::notice::Reached ${MAX_DELETIONS} deletions, the rest is left for the next release"
                break 2
              fi
              gh api -X DELETE "/orgs/${OWNER}/packages/maven/${pkg}/versions/${id}" && deleted=$((deleted + 1)) && count=$((count + 1))
            done
            echo "${pkg}: deleted ${count}"
            echo "- \`${pkg}\`: ${count}" >> $GITHUB_STEP_SUMMARY
          done
          echo "Deleted ${deleted} RC versions in total"
          echo "**Deleted ${deleted} RC versions older than ${RETENTION_DAYS} days**" >> $GITHUB_STEP_SUMMARY
