name: CI

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        description: |
          Artifacts version to publish and for tests.
          If not specified, then `ref_name`, `head_ref` or `latest` will be used based on event.
      force-publish:
        type: boolean
        required: false
        default: false
        description: |
          Force publish artifacts. 
          If false, artifacts will be published only on `release` or on `push` to `develop/master`.
      tests:
        type: boolean
        required: false
        default: true
        description: Run tests.
      mvn-verify-opts:
        type: string
        required: false
        default: "['']"
      fail-on-vulnerability-issues:
        type: string
        required: false
        default: '0'
        description: |
          Fail pipeline if CVEs are identified.
          Default is '0', possible values '0' or '1'
      cve-issue-pkg-types:
        type: string
        required: false
        default: 'jar'
        description: |
          Comma-separated Trivy package types (Results[].Type) to open CVE issues for.
          Default 'jar' files issues only for application (Maven) dependencies.
          Use '*' to file issues for every scanned type, or e.g. 'jar,alpine'.
      cve-issue-branches:
        type: string
        required: false
        default: 'develop,master'
        description: |
          Comma-separated branches on which CVE issues are created.
          The Trivy scan runs on every branch; on other branches the results
          are available only in the job summary and scan artifact.
      debian-packages:
        type: boolean
        required: false
        default: false
        description: Include/Don't include Build and Push Debian Packages
      runner:
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      ORGANIZATION_TOKEN:
        required: true
      HELM_REGISTRY_URL:
        required: true
      HELM_REGISTRY_USER:
        required: true
      HELM_REGISTRY_PASSWORD:
        required: true
      GCP_DEB_REGISTRY_CREDENTIALS:
        required: true
      CODACY_PROJECT_TOKEN:
        required: false
      TRIVY_DB_REPOSITORY:
        required: false
      TRIVY_JAVA_DB_REPOSITORY:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: >
    ${{ 
      inputs.version && inputs.version 
      || (github.event_name == 'push' || github.event_name == 'release') && github.ref_name 
      || (github.event_name == 'pull_request') && github.head_ref 
      || (github.event_name == 'schedule') && format('schedule-build-{0}', github.run_id)
      || 'latest'
    }}

jobs:
  codacy-analysis-cli:
    name: Codacy Analysis CLI
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Set up Maven
        run: cp build.settings.xml ~/.m2/settings.xml
      - name: Maven Build
        run: mvn clean install -DskipTests=true -Dmaven.javadoc.skip=true -Ddockerfile.skip=true -Dgithub.event.release.prerelease="${{ github.event.release.prerelease }}" -B -V -U
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_TOKEN }}
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@master
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        with:
          tool: spotbugs
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          upload: true
          max-allowed-issues: 2147483647
          skip-uncommitted-files-check: true
          verbose: true
        continue-on-error: true

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [ 'linux/amd64' ]
        mvn-verify-opts: ${{ fromJson(inputs.mvn-verify-opts) }}
    steps:
      - name: jobName
        run: |
          echo '# Build 🚀' >> $GITHUB_STEP_SUMMARY
          echo "mvn verify ${{ matrix.mvn-verify-opts }}" >> $GITHUB_STEP_SUMMARY
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Set up Maven
        run: cp build.settings.xml ~/.m2/settings.xml
      - name: Maven Build
        run: mvn clean install -DskipTests=true -Dmaven.javadoc.skip=true -Ddockerfile.skip=true -Dgithub.event.release.prerelease="${{ github.event.release.prerelease }}" -B -V -U
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_TOKEN }}
      - name: Maven Verify
        if: inputs.tests == true && github.event_name != 'release'
        run: mvn verify ${{ matrix.mvn-verify-opts }} -Dgithub.event.release.prerelease="${{ github.event.release.prerelease }}" -B
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_TOKEN }}
      - name: Upload logs
        if: always() && inputs.tests == true
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}-${{ github.run_number }}-${{ runner.name }}
          path: target/logs/
          overwrite: true
      - name: Find all JaCoCo reports
        id: find-coverage
        run: |
          files=$(find . -path '*/target/site/jacoco/jacoco.xml' | paste -sd "," -)
          echo "files=$files" >> $GITHUB_OUTPUT
      - name: Upload coverage to Codacy
        if: ${{ steps.find-coverage.outputs.files != '' }}
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.find-coverage.outputs.files }}
          language: Java

  scan:
    name: Scan with Trivy
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [ 'linux/amd64' ]
    steps:
      - name: Scan Docker Images
        run: echo '# Scan Docker Images' >> $GITHUB_STEP_SUMMARY
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          sudo docker image prune --all --force || true
          docker system df
          df -h        
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Set up Maven
        run: cp build.settings.xml ~/.m2/settings.xml
      - name: Maven Build
        run: mvn clean install -DskipTests=true -Dmaven.javadoc.skip=true -Ddockerfile.skip=true -Dgithub.event.release.prerelease="${{ github.event.release.prerelease }}" -B -V -U
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker
        run: docker login ghcr.io -u ${GITHUB_ACTOR} --password ${{ secrets.ORGANIZATION_TOKEN }}
      - name: Prepare TEST_IMAGE_TAG env
        run: |
          echo TEST_IMAGE_TAG=$(echo ${VERSION} | sed 's/\//-/g') >> $GITHUB_ENV
      
      - name: Make Trivy template file with heredoc
        run: |
          cat << 'EOF' > template.tpl 
          {{- $critical := 0 }}
          {{- $high := 0 }}
          {{- range . }}
            {{- range .Vulnerabilities }}
              {{- if  eq .Severity "CRITICAL" }}
                {{- $critical = add $critical 1 }}
              {{- end }}
              {{- if  eq .Severity "HIGH" }}
                {{- $high = add $high 1 }}
              {{- end }}
            {{- end }}
          {{- end }}
          | VulnerabilityID | Severity |
          | - | - |
          {{- range .}}
            {{- range .Vulnerabilities }}
          | {{ .VulnerabilityID }} |  {{ .Severity }} |
            {{- end }}
          {{- end }}
          | Total Critical | {{ $critical }} |
          | Total High | {{ $high }} |
          EOF
      - name: Build and Scan Docker images with Trivy
        run: |
          echo "Install Trivy scanner for Docker Image Security scanning"
          sudo apt-get update
          sudo apt-get install -y wget > /dev/null 2>&1
          wget -q https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.deb
          sudo dpkg -i trivy_0.74.0_Linux-64bit.deb > /dev/null 2>&1
          # One results file per image, so issues cover all images of the repo
          mkdir -p scan-results
          scanned_images=0
          for directory in `find * -maxdepth 10 -mindepth 0 -type f -name 'Dockerfile' | xargs dirname`
          do
            scanned_images=$((scanned_images + 1))
            echo Run docker buildx build for $directory
            if [[ $directory == '.' ]]; then
              image=${{ github.event.repository.name }}
            else
              image=$directory
            fi
            results=scan-results/$(echo "$image" | sed 's/\//_/g')
            docker buildx build --load --platform ${{ matrix.arch }} \
            -t ghcr.io/${GITHUB_REPOSITORY}/$image:${{ env.TEST_IMAGE_TAG }} \
            $directory 
            echo "Running Trivy scanner for ghcr.io/${GITHUB_REPOSITORY}/$image:${{ env.TEST_IMAGE_TAG }}"
            export TRIVY_DB_REPOSITORY=${{ secrets.TRIVY_DB_REPOSITORY }}
            export TRIVY_JAVA_DB_REPOSITORY=${{ secrets.TRIVY_JAVA_DB_REPOSITORY }}
            docker login ghcr.io -u ${GITHUB_ACTOR} --password ${{ secrets.ORGANIZATION_TOKEN }}

            # Generate JSON output for CVE extraction
            trivy image --format json --exit-code 0 --no-progress --ignore-unfixed --pkg-types os,library --severity CRITICAL,HIGH --output $results.json --timeout 10m  ghcr.io/${GITHUB_REPOSITORY}/$image:${{ env.TEST_IMAGE_TAG }}
            # Generate Markdown output for human-readable report from the JSON, without scanning again
            trivy convert --format template --template @template.tpl --output $results.md $results.json

            echo "## Docker Image: ghcr.io/${GITHUB_REPOSITORY}/$image:${{ env.TEST_IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
            cat $results.md >> $GITHUB_STEP_SUMMARY
          done
          echo "SCANNED_IMAGES=$scanned_images" >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_TOKEN }}
          TRIVY_JAVA_DB_REPOSITORY: ${{ secrets.TRIVY_JAVA_DB_REPOSITORY }}
          TRIVY_DB_REPOSITORY: ${{ secrets.TRIVY_DB_REPOSITORY }}
      - name: Show Docker images
        run: docker images | grep ${GITHUB_REPOSITORY} || (echo Docker images not found && exit 1)
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_TOKEN }}
          TRIVY_JAVA_DB_REPOSITORY: ${{ secrets.TRIVY_JAVA_DB_REPOSITORY }}
          TRIVY_DB_REPOSITORY: ${{ secrets.TRIVY_DB_REPOSITORY }}
      - name: Upload scan results as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: scan-results/

      - name: Create Issues for CVEs
        uses: actions/github-script@v7
        env:
          ACTIVE_TOKEN: ${{ secrets.ORGANIZATION_TOKEN || secrets.GITHUB_TOKEN }}
          GH_ISSUE_LABELS: ${{ vars.GH_ISSUE_LABELS }}
          GH_ORGANIZATION: ${{ vars.GH_ORGANIZATION || github.repository_owner }}
          GH_ISSUES_REPO: ${{ vars.GH_ISSUES_REPO || github.event.repository.name  }}
          CVE_ISSUE_PKG_TYPES: ${{ inputs.cve-issue-pkg-types }}
          CVE_ISSUE_BRANCHES: ${{ inputs.cve-issue-branches }}
        with:
          github-token: ${{ env.ACTIVE_TOKEN }}
          script: |
            const fs = require('fs');
            const repoOwner = process.env.GH_ORGANIZATION;
            const repoName = process.env.GH_ISSUES_REPO;

            // Create issues only on the configured branches
            const branches = (process.env.CVE_ISSUE_BRANCHES || 'develop,master')
              .split(',').map(b => b.trim()).filter(Boolean);
            const branch = context.ref.replace(/^refs\/heads\//, '');
            if (!branches.includes(branch)) {
              console.log(`Skipping CVE issues: '${branch}' is not one of [${branches.join(', ')}].`);
              return;
            }

            // Read the Trivy scan results of all images
            const scanResults = fs.readdirSync('scan-results')
              .filter(f => f.endsWith('.json'))
              .map(f => JSON.parse(fs.readFileSync(`scan-results/${f}`, 'utf8')));

            // Package types (Results[].Type) to open issues for; '*' means all
            const rawPkgTypes = (process.env.CVE_ISSUE_PKG_TYPES || 'jar').trim();
            const allowedTypes = rawPkgTypes === '*'
              ? null
              : rawPkgTypes.split(',').map(t => t.trim()).filter(Boolean);

            // Extract vulnerabilities and prevent duplicates
            const vulnerabilities = new Map();
            for (const data of scanResults) {
              for (const result of data.Results || []) {
                if (allowedTypes && !allowedTypes.includes(result.Type)) {
                  console.log(`Skipping ${data.ArtifactName}: ${result.Target} (type: ${result.Type})`);
                  continue;
                }
                for (const vuln of result.Vulnerabilities || []) {
                  if (vuln.Severity === 'HIGH' || vuln.Severity === 'CRITICAL') {
                    if (!vulnerabilities.has(vuln.VulnerabilityID)) {
                      vulnerabilities.set(vuln.VulnerabilityID, { ...vuln, PkgType: result.Type });
                    }
                  }
                }
              }
            }

            // Get configurable labels or default to ['Security', 'Trivy']
            const customLabels = process.env.GH_ISSUE_LABELS 
              ? process.env.GH_ISSUE_LABELS.split(',').map(label => label.trim()) 
              : ['Security', 'Trivy'];

            // Process vulnerabilities
            const sourceRepo = context.repo.repo;
            for (const [cve, vuln] of vulnerabilities) {
              const searchResult = await github.rest.search.issuesAndPullRequests({
                q: `repo:${repoOwner}/${repoName} "${cve}" "${sourceRepo}" in:title state:open is:issue`,
                per_page: 100
              });

              // Search is token-based ("discovery" also matches "discovery-service"),
              // so verify the exact repo and CVE in the title
              const issueExists = searchResult.data.items.some(issue =>
                issue.title.includes(`[${sourceRepo}] [${cve}]`));
              if (!issueExists) {
                // Ensure severity label is always included
                const labels = [vuln.Severity, ...customLabels];
            
                // Create a new issue
                const pkg = `${vuln.PkgType}:${vuln.PkgName}`;
                // Short package name and installed version in the title,
                // e.g. 'org.eclipse.jetty:jetty-http' 10.0.26 -> 'jetty-http:10.0.26'
                const shortPkg = `${vuln.PkgType}:${vuln.PkgName.split(':').pop()}:${vuln.InstalledVersion}`;
                const issueTitle = `[${vuln.Severity}] [${sourceRepo}] [${cve}] ${shortPkg}`;
                await github.rest.issues.create({
                  owner: repoOwner,
                  repo: repoName,
                  title: issueTitle,
                  body: `### Trivy Security Scan Findings in \`${context.repo.repo}\`\n\n- **CVE**: ${cve}\n- **Severity**: ${vuln.Severity}\n- **Package**: \`${pkg}\`\n- **Installed**: ${vuln.InstalledVersion} → **Fixed in**: ${vuln.FixedVersion || 'n/a'}\n\n[CVE Details](https://nvd.nist.gov/vuln/detail/${cve})\n\n[View scan results](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${{ github.run_id }})`,
                  labels: labels
                });
                console.log(`Created issue for ${sourceRepo} ${cve} with labels: ${labels.join(', ')}`);
              } else {
                console.log(`Issue for ${sourceRepo} ${cve} already exists.`);
              }
            }

            // Close open issues of this repo whose CVE is no longer found in any image.
            // Only when every scanned image has results, so a missing file can't close valid issues.
            const scannedImages = Number(process.env.SCANNED_IMAGES || 0);
            if (scannedImages === 0 || scanResults.length !== scannedImages) {
              console.log(`Skipping closing of resolved CVE issues: ${scanResults.length} results for ${scannedImages} scanned images.`);
              return;
            }

            // Any CVE still present in any image, regardless of package type, keeps its issue open
            const foundCves = new Set();
            for (const data of scanResults) {
              for (const result of data.Results || []) {
                for (const vuln of result.Vulnerabilities || []) {
                  foundCves.add(vuln.VulnerabilityID);
                }
              }
            }

            const openIssues = await github.paginate(github.rest.search.issuesAndPullRequests, {
              q: `repo:${repoOwner}/${repoName} "${sourceRepo}" in:title state:open is:issue`,
              per_page: 100
            });

            // Title format: [SEVERITY] [<repo>] [<CVE>] <type>:<artifact>:<version>
            const titlePrefix = `] [${sourceRepo}] [`;
            for (const issue of openIssues) {
              const start = issue.title.indexOf(titlePrefix);
              if (start < 0) continue;
              const cve = issue.title.slice(start + titlePrefix.length).split(']')[0];
              if (foundCves.has(cve)) continue;

              await github.rest.issues.createComment({
                owner: repoOwner,
                repo: repoName,
                issue_number: issue.number,
                body: `${cve} is no longer found in \`${sourceRepo}\` on \`${branch}\` (${context.sha.slice(0, 7)}), closing as resolved.\n\n[View scan results](https://github.com/${context.repo.owner}/${sourceRepo}/actions/runs/${{ github.run_id }})`
              });
              await github.rest.issues.update({
                owner: repoOwner,
                repo: repoName,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              console.log(`Closed #${issue.number} for ${sourceRepo} ${cve}: no longer found.`);
            }

  push:
    outputs:
      images: ${{ steps.pushDockerImages.outputs.images }}
    if: >
      (github.event_name != 'schedule' && inputs.force-publish == true)
      || (github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'master'))
      || github.event_name == 'release'
    name: Push artifacts
    needs: [ build, scan ]
    runs-on: ${{ inputs.runner }}
    steps:
      - name: jobName
        run: echo '# Push 🚀' >> $GITHUB_STEP_SUMMARY
      - name: Overwrite VERSION env
        run: |
          echo VERSION=$(echo ${VERSION} | sed 's/\//-/g') >> $GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Set up Maven
        run: cp build.settings.xml ~/.m2/settings.xml
      - name: Deploy jars
        run: mvn clean deploy -DskipTests -Dgpg.skip=true -Drevision=${VERSION}-SNAPSHOT -B -V -U
        env:
          GITHUB_TOKEN: ${{ secrets.ORGANIZATION_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker
        run: docker login ghcr.io -u ${GITHUB_ACTOR} --password ${{ secrets.ORGANIZATION_TOKEN }}

      - name: Push Docker images
        id: pushDockerImages
        run: |
          IMAGES=()
          echo "## Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "| Image Name |" >> $GITHUB_STEP_SUMMARY
          echo "| - | ">> $GITHUB_STEP_SUMMARY
          for directory in $(find . -maxdepth 10 -type d)
          do
            clean_dir="${directory#./}"
            [[ "$clean_dir" == "." ]] && clean_dir=""
            # Find Dockerfiles inside this directory (non-recursive)
            dockerfiles=$(find "$directory" -maxdepth 1 -type f \( -name 'Dockerfile' -o -name 'Dockerfile-*' \))
          
            # Skip if none found
            [[ -z "$dockerfiles" ]] && continue
          
            for dockerfile in $dockerfiles
            do
              filename=$(basename "$dockerfile")
          
              echo "Run docker build for $dockerfile"
          
              # Extract suffix if present
              if [[ "$filename" =~ ^Dockerfile-(.+)$ ]]; then
                suffix="${BASH_REMATCH[1]}"
              else
                suffix=""
              fi
          
              # Base image name
              if [[ -z "$clean_dir" ]]; then
                image="${{ github.event.repository.name }}"
              else
                image="$clean_dir"
              fi
          
              # Append suffix if it exists
              if [[ -n "$suffix" ]]; then
                tag="${{ env.VERSION }}-${suffix}"
              else
                tag="${{ env.VERSION }}"
              fi
          
              docker buildx build --push --platform linux/amd64,linux/arm64 \
                -f "$dockerfile" \
                -t ghcr.io/${GITHUB_REPOSITORY}/$image:$tag \
                -t ghcr.io/${GITHUB_REPOSITORY}/$image:latest \
                "$directory"
          
              echo "| ghcr.io/${GITHUB_REPOSITORY}/$image:$tag |" >> $GITHUB_STEP_SUMMARY
              IMAGES+=("ghcr.io/${GITHUB_REPOSITORY}/$image:$tag")
          
            done
          done
          # Convert the array to a JSON string
          json_array="["
          for element in "${IMAGES[@]}"; do
              json_array+="$element,"
          done
          json_array="${json_array%,}]"
          echo "::set-output name=img::$json_array"

          VERSION=$(date +%Y%m%d%H%M%S)
          echo "images=$json_array" >> $GITHUB_OUTPUT
          echo "####################################"
          echo $VERSION
          echo "####################################"
          echo ${IMAGES[@]}
          echo "####################################"
          echo $json_array

      - name: Package and publish to helm registry
        run: |
          for directory in `find ./charts -type d -maxdepth 1 -mindepth 1`
          do
            echo helm package for $directory
            name=$(cat $directory/Chart.yaml | grep ^name: | cut -d: -f2 | cut -c 2- | tr -d '"')
            chart_version=$(cat $directory/Chart.yaml | grep ^version: | cut -d: -f2 | cut -c 2- | tr -d '"')
            release_version=$chart_version-${{ env.VERSION }}
            echo Release chart version $release_version
            # change helm chart version in Chart.yaml
            sed -i.bak 's/version:.*/version: '$release_version'/g' $directory/Chart.yaml
            # change helm chart SHA in values.yaml
            sed -i.bak 's/SHA:.*/SHA: '${{ github.sha }}'/g' $directory/values.yaml
            helm lint --strict $directory || exit 42
            helm template --debug $directory
            helm package --debug $directory
            pkg=$name-$release_version.tgz
            echo push to GitHub Helm Registry oci://ghcr.io/${{ vars.GH_ORGANIZATION }}/${{ vars.GH_HELM_REGISTRY_REPO }}
            helm push $pkg oci://ghcr.io/${{ vars.GH_ORGANIZATION }}/${{ vars.GH_HELM_REGISTRY_REPO }}
            # revert changes of helm chart version and remove bak files
            rm $directory/Chart.yaml
            mv $directory/Chart.yaml.bak $directory/Chart.yaml
            # revert changes of helm SHA value and remove bak files
            rm $directory/values.yaml
            mv $directory/values.yaml.bak $directory/values.yaml
          done

      - name: Authenticate to Google Cloud
        if: always() && inputs.debian-packages == true
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: '${{ vars.GCP_DEB_REGISTRY_PROJECT }}'
          credentials_json: '${{ secrets.GCP_DEB_REGISTRY_CREDENTIALS}}'

      - name: 'Set up Cloud SDK'
        if: always() && inputs.debian-packages == true
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'

      - name: Build .deb packages and Push to Google Artifactory DEB Registry
        if: always() && inputs.debian-packages == true
        run: |
          for directory in `find * -maxdepth 10 -mindepth 0 -type f -name 'Dockerfile' | xargs dirname`
          do
            echo Run package build for $directory
            if [[ $directory == '.' ]]; then
              package=${{ github.event.repository.name }}
            else
              package=$directory
            fi
            export DIRECTORY=$directory
            echo "DIRECTORY<<EOF" >> ${GITHUB_ENV}
            echo "${DIRECTORY}" >> ${GITHUB_ENV}
            echo "EOF" >> ${GITHUB_ENV}
            if [[ "${{ env.VERSION }}" == *develop* || "${{ env.VERSION }}" == *master* || "${{ env.VERSION }}" != [0-9]* ]]; then
               export VERSION=1.0-$(git rev-parse --abbrev-ref HEAD)-$(git describe --tags --abbrev=1 2>/dev/null)-${GITHUB_RUN_ATTEMPT}
            else
               export VERSION=${{ env.VERSION }}-${GITHUB_RUN_ATTEMPT}
            fi
            echo "VERSION<<EOF" >> ${GITHUB_ENV}
            echo "${VERSION}" >> ${GITHUB_ENV}
            echo "EOF" >> ${GITHUB_ENV}
            echo Release package version $VERSION
            if [ -f $directory/src/deb/build-deb.sh ]; then
                cd $directory 
                # change the DEB SHA ENV value in default-env file & make backup
                sed -i.bak 's/SHA=.*/SHA='${{ github.sha }}'/g' ./src/deb/templates/default-env
                source ./src/deb/build-deb.sh
                PACKAGE_NAME=./target/${SERVICE_NAME}-${VERSION}.deb
                echo push to Google Artifactory Debian Registry $DEB_REGISTRY
                gcloud artifacts apt upload $DEB_REGISTRY --location=$REGISTRY_LOCATION --source=$PACKAGE_NAME
                # revert changes of the DEB SHA ENV value & remove backup file
                rm ./src/deb/templates/default-env
                mv ./src/deb/templates/default-env.bak ./src/deb/templates/default-env
                cd ..
            else
               echo "The file $directory/src/deb/build-deb.sh does not exist in $directory. Skip it."
            fi
          done
        env:
          DEB_REGISTRY: ${{ vars.GCP_DEB_REGISTRY }}
          REGISTRY_LOCATION: ${{ vars.GCP_REGISTRY_LOCATION }}
          DIRECTORY: ${{ env.DIRECTORY }}

      - name: Rollback release
        if: failure() && github.event_name == 'release'
        run: |
          echo Remove git tag
          git push origin :refs/tags/${{ github.event.release.tag_name }}

  notify_failure:
    name: Create Issue on Failure
    if: ${{ failure() && github.event_name == 'schedule' }}
    needs: [ build, scan ]
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Create GitHub Issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.ORGANIZATION_TOKEN }}
          script: |
            const repoName = '${{ github.repository }}';
            const repoShortName = repoName.split('/')[1];
            const issueTitle = `Scheduled Build Fail (${repoShortName})`;
            const issueBody = `Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            // Set the owner and repo to open/close GitHub issues
            const owner = '${{ vars.GH_ORGANIZATION }}';
            const repo = '${{ vars.GH_ISSUES_REPO }}';

            // Check if an open issue with the same title exists
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open'
            });

            const issueExists = issues.some(issue => issue.title === issueTitle);

            if (!issueExists) {
              // Create a new issue
              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body: issueBody,
                type: 'Bug',
                labels: ['Technical']
              });
              console.log('New issue is created for the failed scheduled build');
            } else {
              console.log('Open issue for the failed scheduled build already exists');
            }

  close_issue:
    name: Close Issue on Success
    if: ${{ success() && github.event_name == 'schedule' }}
    needs: [ build, scan ]
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Close GitHub Issue
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.ORGANIZATION_TOKEN }}
          script: |
            const repoName = '${{ github.repository }}';
            const repoShortName = repoName.split('/')[1];
            const issueTitle = `Scheduled Build Fail (${repoShortName})`;
            const closeComment = `Closed due to success build: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            // Set the owner and repo to open/close GitHub issues
            const owner = '${{ vars.GH_ORGANIZATION }}';
            const repo = '${{ vars.GH_ISSUES_REPO }}';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open'
            });

            if (issues.length === 0) {
              console.log('No open issues to close');
            } else {
              let issueClosed = false;
              for (const issue of issues) {
                if (issue.title === issueTitle) {
                  // Add a comment to the issue
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: closeComment,
                  });
                  // Close the issue
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: issue.number,
                    state: 'closed',
                  });
                  console.log(`Closed issue #${issue.number}`);
                  issueClosed = true;
                }
              }
            
              if (!issueClosed) {
                console.log('No issues found to close');
              }
            }
